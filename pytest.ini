[pytest]
testpaths = tests/backend
pythonpath = backend
addopts = -q -ra
markers =
    ocr: cần PaddleOCR và mô hình OCR có sẵn trên máy (tự bỏ qua nếu thiếu)
    realdata: chạy trên file DAV_unique.xlsx đầy đủ (tự bỏ qua nếu thiếu)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
